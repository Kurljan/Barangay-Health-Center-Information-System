<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHIS — Barangay Health Information System</title>
  <meta name="description" content="A role-based health information system for managing prenatal care, child immunization, user accounts, and FHSIS reports for barangay health centers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">

  <!-- jsPDF + AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js"></script>
  <!-- SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.js"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Bootstrap JS -->
  <script src="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- ===== LOGIN PAGE ===== -->
  <div id="login-page">
    <div class="login-container" style="position: relative;">
      <a href="index.html" style="position: absolute; top: 32px; left: 32px; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; color: var(--gray-600); text-decoration: none; transition: all 0.2s ease;" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color='var(--gray-600)'">
        <i class="ph-bold ph-arrow-left"></i> Back to Home
      </a>
      <div class="login-card">
        <div class="login-logo">
          <img src="assets/logo/KibalabagLogo.svg" alt="Kibalabag Logo" style="width: 80px; height: 80px; margin: 0 auto 16px; display: block; object-fit: contain;">
          <h1>Kibalabag BHIS</h1>
          <p>Kibalabag Barangay Health Center</p>
        </div>

        <div style="font-size:0.75rem;color:var(--text-secondary);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em;">Select your role</div>
        <div class="role-selector">
          <button type="button" class="role-sel-btn active" data-role="Admin" onclick="selectRole(this)">
            <span class="rs-icon"><i class="ph-fill ph-user"></i></span>Admin
          </button>
          <button type="button" class="role-sel-btn" data-role="Midwife" onclick="selectRole(this)">
            <span class="rs-icon"><i class="ph-fill ph-first-aid-kit"></i></span>Midwife
          </button>
          <button type="button" class="role-sel-btn" data-role="BHW" onclick="selectRole(this)">
            <span class="rs-icon"><i class="ph-fill ph-house"></i></span>BHW
          </button>
        </div>

        <form id="login-form" onsubmit="Auth.handleLogin(event)" novalidate>
          <div class="form-group">
            <label for="login-username">Username</label>
            <input
              type="text"
              id="login-username"
              class="form-control"
              placeholder="Enter your username"
              autocomplete="username"
              required
            >
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
          </div>

          <div id="login-error" class="alert alert-danger" style="display:none;margin-bottom:14px;"></div>

          <button type="submit" class="btn btn-primary btn-full" id="login-btn" style="padding:11px 18px;font-size:0.9rem;">
            Sign In
          </button>
        </form>

        <p style="text-align:center;margin-top:18px;font-size:0.74rem;color:var(--text-muted);line-height:1.7;">
          Demo accounts:<br>
          <code>admin / admin123</code> &nbsp;·&nbsp;
          <code>midwife / midwife123</code> &nbsp;·&nbsp;
          <code>bhw / bhw123</code>
        </p>
      </div>
    </div>
  </div>

  <!-- ===== APP SHELL ===== -->
  <div id="app-shell" style="display:none;">

    <!-- Mobile sidebar toggle -->
    <button id="sidebar-toggle" onclick="UI.toggleSidebar()" aria-label="Toggle menu">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="UI.toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-logo">
        <img src="assets/logo/KibalabagLogo.svg" alt="Kibalabag Logo" style="width: 42px; height: 42px; object-fit: contain;">
        <div class="logo-text">
          <h2>Kibalabag BHIS</h2>
          <span id="sidebar-barangay">Kibalabag Barangay Health System</span>
        </div>
      </div>

      <nav id="sidebar-nav"></nav>

      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar" aria-hidden="true">A</div>
        <div class="sidebar-user-info">
          <div class="sname" id="sidebar-name">User</div>
          <div class="srole" id="sidebar-role">Role</div>
        </div>
        <button class="logout-btn" onclick="Auth.logout()" title="Sign Out" aria-label="Sign out">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA (dynamically rendered) -->
    <main id="main-content" role="main"></main>
  </div>

  <!-- ===== MODAL OVERLAY ===== -->
  <div id="modal-overlay" style="display:none;" onclick="UI.closeModalOnOverlay(event)" role="dialog" aria-modal="true">
    <div id="modal-container"></div>
  </div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <script src="app.js?v=3"></script>
  <script>
    function selectRole(btn) {
      document.querySelectorAll('.role-sel-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const role = btn.getAttribute('data-role').toLowerCase();
      document.getElementById('login-username').value = role;
      document.getElementById('login-password').value = role + '123';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('login-username').value = 'admin';
      document.getElementById('login-password').value = 'admin123';
    });
  </script>
</body>
</html>
